services:
  monitor:
    build:
      context: ../..
      dockerfile: deploy/monitor/Dockerfile
    image: traceroot-monitor:local
    restart: unless-stopped
    env_file:
      - ${TRACEROOT_ENV_FILE:-../../.env}
    command:
      - --name
      - ${TRACEROOT_MONITOR_NAME:-eduforge-ai}
      - --url
      - ${TRACEROOT_MONITOR_URL:-https://eduforge-ai.azurewebsites.net}
      - --repository
      - ${TRACEROOT_MONITOR_REPOSITORY:-https://github.com/23f3001800/EduForge-AI}
      - --workspace-dir
      - /data/workspace
      - --state-file
      - /data/cursor.json
      - --interval
      - ${TRACEROOT_MONITOR_INTERVAL:-30}
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - monitor-data:/data
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 64
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import pathlib,time; p=pathlib.Path('/data/cursor.json'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime < 180 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
volumes:
  monitor-data:
