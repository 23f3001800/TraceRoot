    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;fill:#20282d}.title{font-size:31px;font-weight:850}.subtitle{font-size:14px;fill:#59656c}.group-title{font-size:15px;font-weight:850}.label{font-size:13px;font-weight:800;text-anchor:middle}.tiny{font-size:10px;fill:#526068;text-anchor:middle}
      .group{stroke:#6c7478;stroke-width:1.5;stroke-dasharray:4 4;filter:url(#shadow)}.node{stroke:#4e5960;stroke-width:1.4;filter:url(#shadow)}.icon{color:#26343c}
      .flow{fill:none;stroke:#222;stroke-width:2.2;marker-end:url(#arrow)}.data{fill:none;stroke:#222;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}.audit{fill:none;stroke:#6945b8;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#purpleArrow)}
