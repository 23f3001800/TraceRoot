      .yellow{fill:#fff0ad}.amber{fill:#ffd06a}.blue{fill:#dcecff}.cyan{fill:#def6f7}.green{fill:#e2f5e8}.purple{fill:#ece4ff}.pink{fill:#ffe1e1}.gray{fill:#f1f3f4}.white{fill:#fff}.red{fill:#ffe4e1;stroke:#d64040}.step circle{fill:#111827;stroke:#fff;stroke-width:2}.step text{fill:#fff;font-size:11px;font-weight:850;text-anchor:middle;dominant-baseline:middle}
      @keyframes move{to{stroke-dashoffset:-48}}@media(prefers-reduced-motion:reduce){.active{animation:none}}
