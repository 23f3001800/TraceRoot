<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">TraceRoot application architecture and agent pipeline</title>
  <desc id="desc">Technical architecture showing monitored applications and Azure telemetry entering TraceRoot, a central orchestration layer coordinating Investigator, Evidence Auditor, and Remediation Planner agents, bounded evidence tools, durable storage, approval-controlled execution, staging, evaluation, and OpenTelemetry.</desc>
