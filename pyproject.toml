[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceroot"
version = "0.1.0"
description = "One bounded investigator with read-only tools"
requires-python = ">=3.12"
dependencies = ["google-genai==2.22.0", "jsonschema==4.25.1", "langgraph==1.2.11", "psycopg[binary]==3.2.10", "opentelemetry-sdk==1.37.0", "opentelemetry-exporter-otlp-proto-http==1.37.0"]

[project.optional-dependencies]
orchestrators = ["crewai==1.15.22", "autogen-agentchat==0.7.5"]

[tool.setuptools.packages.find]
include = ["traceroot*"]

[tool.setuptools.package-data]
traceroot = ["runtime/*.py", "runtime/*.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
