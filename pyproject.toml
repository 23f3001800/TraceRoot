[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceroot"
version = "0.1.0"
description = "Bounded, read-only investigation tools"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = ["traceroot*"]

[tool.setuptools.package-data]
traceroot = ["runtime/*.py", "runtime/*.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
