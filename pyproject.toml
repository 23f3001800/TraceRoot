[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceroot"
version = "0.1.0"
description = "One bounded investigator with read-only tools"
requires-python = ">=3.12"
dependencies = ["google-genai==2.22.0", "jsonschema==4.25.1"]

[tool.setuptools.packages.find]
include = ["traceroot*"]

[tool.setuptools.package-data]
traceroot = ["runtime/*.py", "runtime/*.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
