<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TraceRoot Incident Workspace</title><link rel="stylesheet" href="/workspace/styles.css"></head><body><main><header><p>TraceRoot</p><h1>Incident Workspace</h1><span id="connection">Connecting</span></header><section><h2>Report an incident</h2><p>Reports stay local. Submitting does not start an investigation.</p><form id="report"><label>Target repository<input name="repository" placeholder="/path/to/target" required></label><label>What happened?<textarea name="report" required placeholder="Describe the observed failure."></textarea></label><label>Optional reproduction command<input name="reproduction_command" placeholder="pytest -q tests/test_case.py"></label><button>Save incident</button><output id="notice"></output></form></section><section><h2>Reported incidents</h2><div id="incidents" aria-live="polite"></div></section></main><script src="/workspace/app.js"></script></body></html>
